name: Build Anime Image Studio Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build-android-apk.sh'
      - 'android/README.md'
      - 'android/THIRD_PARTY_NOTICES.txt'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: anime-image-studio-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout app build scripts
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android build tools
        uses: android-actions/setup-android@v3

      - name: Install Android signing tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Build and verify branded APK
        run: bash scripts/build-android-apk.sh

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Image-Studio-Android-APK
          path: Anime-Image-Studio-arm64.apk
          if-no-files-found: error
          retention-days: 30
